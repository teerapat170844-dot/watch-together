# Minimal UI สำหรับ Watch Together

เอาโค้ดส่วนนี้ไปแทนใน `public/index.html`

```html
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Together</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background: #181818;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 32px;
    }

    .top {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: #242424;
      color: white;
      font-size: 15px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.03);
    }

    iframe {
      width: 100%;
      height: 540px;
      border: none;
      border-radius: 18px;
      margin-top: 20px;
      background: black;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }

    .chat-box {
      height: 350px;
      overflow-y: auto;
      background: #111;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .msg {
      margin-bottom: 12px;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
    }

    .users {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user {
      background: #222;
      padding: 12px;
      border-radius: 12px;
    }

    @media(max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      iframe {
        height: 250px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <h1>🎬 Watch Together</h1>

  <div class="card">
    <div class="top">
      <input id="name" placeholder="ชื่อ">
      <input id="room" placeholder="รหัสห้อง">
      <button onclick="joinRoom()">เข้าห้อง</button>
    </div>

    <div class="top" style="margin-top:15px;">
      <input id="videoUrl" placeholder="วางลิงก์ YouTube">
      <button onclick="setVideo()">เปิดวิดีโอ</button>
    </div>

    <iframe id="player" allow="autoplay"></iframe>
  </div>

  <div class="grid">

    <div class="card">
      <h2 style="margin-bottom:15px;">💬 แชท</h2>

      <div class="chat-box" id="chat"></div>

      <div class="top">
        <input id="msg" placeholder="พิมพ์ข้อความ...">
        <button onclick="sendMsg()">ส่ง</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom:15px;">👥 คนในห้อง</h2>

      <div class="users" id="users"></div>
    </div>

  </div>

</div>

<script>
const socket = io();

let roomId = "";
let name = "";

function joinRoom() {
  roomId = document.getElementById("room").value;
  name = document.getElementById("name").value;

  socket.emit("join-room", {
    roomId,
    name
  });
}

function setVideo() {
  const url = document.getElementById("videoUrl").value;

  let videoId = "";

  if (url.includes("watch?v=")) {
    videoId = url.split("watch?v=")[1].split("&")[0];
  } else if (url.includes("youtu.be/")) {
    videoId = url.split("youtu.be/")[1];
  }

  const embed = `https://www.youtube.com/embed/${videoId}`;

  document.getElementById("player").src = embed;

  socket.emit("video-update", {
    roomId,
    video: embed
  });
}

socket.on("video-update", (video) => {
  document.getElementById("player").src = video;
});

socket.on("room-data", (data) => {
  document.getElementById("users").innerHTML = data.users
    .map(user => `<div class="user">${user.name}</div>`)
    .join("");
});

function sendMsg() {
  const message = document.getElementById("msg").value;

  socket.emit("chat-message", {
    roomId,
    name,
    message
  });

  document.getElementById("msg").value = "";
}

socket.on("chat-message", (data) => {
  const chat = document.getElementById("chat");

  chat.innerHTML += `
    <div class="msg">
      <b>${data.name}</b><br>
      ${data.message}
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
```

หลังแก้เสร็จ:

```bash
git add .
git commit -m "minimal ui"
git push
```

แล้วรอ Render deploy อัตโนมัติประมาณ 1-2 นาที
